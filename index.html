<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="copylee 的个人主页：笔记、开源项目与个人服务入口。" />
    <meta name="theme-color" content="#fcfcfd" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Copy Lee</title>
    <script>
      // 在首屏绘制前确定主题，避免闪烁：优先用户上次的选择，否则跟随系统
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
        if (t === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0c0d10')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
