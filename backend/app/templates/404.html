{% extends "base.html" %}
{% from "macros.html" import chars, grid %}
{% block content %}
<div class="page-heading not-found">{{ grid() }}<div class="container page-heading-content">
  <p class="label reading-rise">Not found</p>
  <h1 class="page-title" aria-label="404">{{ chars("404") }}</h1>
  <p class="page-intro reading-rise" style="--delay:200ms">{{ heading }}<span>{{ detail }}</span></p>
  <nav class="not-found-links reading-rise" style="--delay:320ms" aria-label="可以去的地方">

  </nav>
</div></div>
{% endblock %}
