[project]
name = "copylee-backend"
version = "0.1.0"
description = "Content management for copylee.cn"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlmodel>=0.0.24,<0.1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23,<26",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "markdown-it-py>=3,<5",
  "nh3>=0.2,<1",
  "pillow>=11,<13",
  "webauthn>=2.7,<3",
  "pyotp>=2.9,<3",
  "qrcode>=8,<9",
  "cryptography>=45,<48",
  "beautifulsoup4>=4.13,<5",
  "mdit-py-plugins>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
