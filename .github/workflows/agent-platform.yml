name: Check Agent platform
on:
  workflow_dispatch:
  push:
    paths: ["agent-platform/**", ".github/workflows/agent-platform.yml", ".dockerignore"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # The gateway serves the built SPA; build it so shell/asset routes match production.
      - run: npm ci --no-audit --no-fund
        working-directory: agent-platform/web
      - run: npm run build
        working-directory: agent-platform/web
      - run: npm ci --no-audit --no-fund
        working-directory: agent-platform/gateway-deps
      - run: node --test agent-platform/tests/*.test.mjs
      - run: python3 agent-platform/tests/workspace-broker.test.py
      - run: docker compose --env-file .env.example config --quiet
        working-directory: agent-platform
