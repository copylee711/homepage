name: copylee-agent
networks:
  default:
    ipam:
      config: [{ subnet: 192.168.84.0/24 }]
services:
  gateway:
    build:
      context: ..
      dockerfile: agent-platform/Dockerfile.gateway
    restart: unless-stopped
    init: true
    ports: ["127.0.0.1:18080:8080"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      HOMEPAGE_URL: ${HOMEPAGE_URL:?set HOMEPAGE_URL}
      HOMEPAGE_CLIENT_SECRET: ${HOMEPAGE_CLIENT_SECRET:?set HOMEPAGE_CLIENT_SECRET}
      RUNNER_SECRET: ${RUNNER_SECRET:?set RUNNER_SECRET}
      PI_MODEL: ${PI_MODEL:-opencode-go/deepseek-v4.1-flash}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      runner: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  runner:
    build:
      context: ..
      dockerfile: agent-platform/Dockerfile.runner
    restart: unless-stopped
    init: true
    environment:
      RUNNER_SECRET: ${RUNNER_SECRET:?set RUNNER_SECRET}
      OPENCODE_API_KEY: ${OPENCODE_GO_API_KEY:?set OPENCODE_GO_API_KEY}
      PI_MODEL: ${PI_MODEL:-opencode-go/deepseek-v4.1-flash}
    volumes:
      - ./data:/data
      - ./workspace:/workspace
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=256m,nosuid"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 160
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
