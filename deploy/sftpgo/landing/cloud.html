<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy Lee Cloud · 个人私有云</title>
<meta name="description" content="Copy Lee 的个人私有云盘。">
<meta name="robots" content="noindex">
<link rel="icon" href="/static/branding/favicon.svg" type="image/svg+xml">
<style>
:root { --bg:#fcfcfd; --tint:#eef2fb; --surface:#fff; --text:#111114; --text2:#4b5563; --muted:#6b7280; --faint:#9ca3af; --line:rgba(17,24,39,.08); --accent:#3b6ef5; --soft:rgba(59,110,245,.1); --grid:rgba(59,110,245,.09); --btn:#1c1c20; --btnfg:#fff; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c0d10; --tint:#121829; --surface:#14161b; --text:#f3f4f6; --text2:#b6bcc8; --muted:#9097a3; --faint:#656c78; --line:rgba(255,255,255,.09); --accent:#6d93ff; --soft:rgba(109,147,255,.16); --grid:rgba(109,147,255,.1); --btn:#f3f4f6; --btnfg:#111114; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:linear-gradient(120deg,var(--bg) 35%,var(--tint)); color:var(--text); font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; }
.grid { position:fixed; inset:0; z-index:-1; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:48px 48px; mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 65%); }
main { flex:1; display:grid; place-items:center; padding:48px 24px; }
.card { width:min(560px,100%); animation:rise .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity:0; transform:translateY(16px); } }
.mark { width:56px; height:auto; color:var(--text); }
.label { margin:28px 0 0; color:var(--faint); font-size:12px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; }
h1 { margin:10px 0 12px; font-size:clamp(2.2rem,7vw,3.4rem); line-height:1.1; letter-spacing:-.03em; }
.intro { margin:0; color:var(--text2); font-size:17px; }
.note { margin:10px 0 0; color:var(--faint); font-size:14px; }
.actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; }
.btn { display:inline-flex; align-items:center; gap:10px; padding:12px 24px; border-radius:10px; background:var(--surface); color:var(--text); text-decoration:none; font-weight:500; box-shadow:0 0 0 1px var(--line),0 4px 14px -6px rgba(17,24,39,.16); transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s; }
.btn:hover { transform:translateY(-2px); }
.btn.primary { background:var(--btn); color:var(--btnfg); }
footer { padding:28px 24px; text-align:center; color:var(--faint); font-size:13px; border-top:1px solid var(--line); }
footer a { color:var(--muted); text-decoration:none; }
footer a:hover { color:var(--accent); }
footer p { margin:4px 0; }
@media (prefers-reduced-motion: reduce) { .card { animation:none; } }
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<main>
  <div class="card">
    <svg class="mark" viewBox="0 0 340 280" fill="currentColor" aria-hidden="true"><path d="M255 0H140A137 137 0 0 0 140 274V224A87 87 0 0 1 140 50H205Z"/><path d="M160 80h48v144h122l-50 50H160Z"/></svg>
    <p class="label">Private cloud</p>
    <h1>Copy Lee Cloud</h1>
    <p class="intro">个人文件存储、备份与多设备同步。</p>
    <p class="note">私有云，仅供本人及受邀亲友使用，不开放注册。</p>
    <div class="actions">
      <a class="btn primary" href="/web/client/login">登录云盘 →</a>
      <a class="btn" href="https://copylee.cn/">返回主页</a>
    </div>
  </div>
</main>
<footer>
  <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2026159168号</a></p>
  <p>© Copy Lee · <a href="https://copylee.cn/">copylee.cn</a></p>
</footer>
</body>
</html>
