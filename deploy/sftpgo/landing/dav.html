<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy Lee WebDAV · 私有同步接口</title>
<meta name="description" content="Copy Lee 私有云的 WebDAV 同步接口。">
<meta name="robots" content="noindex">
<style>
:root { --bg:#fcfcfd; --tint:#eef2fb; --surface:#fff; --text:#111114; --text2:#4b5563; --muted:#6b7280; --faint:#9ca3af; --line:rgba(17,24,39,.08); --accent:#3b6ef5; --grid:rgba(59,110,245,.09); color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c0d10; --tint:#121829; --surface:#14161b; --text:#f3f4f6; --text2:#b6bcc8; --muted:#9097a3; --faint:#656c78; --line:rgba(255,255,255,.09); --accent:#6d93ff; --grid:rgba(109,147,255,.1); color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:linear-gradient(120deg,var(--bg) 35%,var(--tint)); color:var(--text); font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; }
.grid { position:fixed; inset:0; z-index:-1; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:48px 48px; mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 65%); }
main { flex:1; display:grid; place-items:center; padding:48px 24px; }
.card { width:min(560px,100%); }
.label { margin:0; color:var(--faint); font-size:12px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; }
h1 { margin:10px 0 12px; font-size:clamp(2rem,6vw,3rem); line-height:1.1; letter-spacing:-.03em; }
p { margin:0; color:var(--text2); }
code { padding:2px 8px; border-radius:6px; background:var(--surface); border:1px solid var(--line); font-family:ui-monospace,Consolas,monospace; font-size:14px; }
.note { margin-top:16px !important; color:var(--faint) !important; font-size:14px; }
a { color:var(--accent); }
footer { padding:28px 24px; text-align:center; color:var(--faint); font-size:13px; border-top:1px solid var(--line); }
footer a { color:var(--muted); text-decoration:none; }
footer p { margin:4px 0; color:var(--faint); }
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<main>
  <div class="card">
    <p class="label">Private sync endpoint</p>
    <h1>Copy Lee WebDAV</h1>
    <p>这是 <a href="https://cloud.copylee.cn/">Copy Lee 私有云</a> 的 WebDAV 同步接口，供已授权账号在文件管理器或同步客户端中挂载使用，浏览器无法直接浏览文件。</p>
    <p style="margin-top:12px">客户端地址：<code>https://dav.copylee.cn/</code></p>
    <p class="note">私有云，仅供本人及受邀亲友使用，不开放注册。</p>
  </div>
</main>
<footer>
  <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2026159168号-1</a></p>
  <p>© Copy Lee · <a href="https://copylee.cn/">copylee.cn</a></p>
</footer>
</body>
</html>
